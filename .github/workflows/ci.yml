name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Step 6: set to "true" so CI fails whenever the incident replay would lose
  # production, the backup stops restoring, or an agent's destructive call
  # gets through. Until then, CI only records what happened.
  LAB_ENFORCE: "false"

jobs:
  tooling:
    name: Exercise tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run verify
      - name: Compile the agentic review and check any committed lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_AW_BINARY: ${{ runner.temp }}/gh-aw-v0.86.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64 \
            --output "$GH_AW_BINARY"
          printf '%s  %s\n' \
            b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e \
            "$GH_AW_BINARY" | sha256sum --check --status
          chmod u+x "$GH_AW_BINARY"
          npm run compile:review
          node scripts/check-review-lock.mjs

  lab:
    name: Incident lab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check Terraform formatting and configuration
        run: |
          terraform fmt -check -recursive infrastructure
          terraform -chdir=infrastructure/lab init -backend=false -input=false
          terraform -chdir=infrastructure/lab validate
      - name: Restore drill, incident replay, and agent replay
        run: make evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab-evidence
          path: .lab/evidence/lab-evidence.json
          if-no-files-found: warn
          retention-days: 30

  complete:
    name: CI
    if: always()
    needs: [tooling, lab]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node --input-type=module -e \
            'const results = JSON.parse(process.env.RESULTS); if (!results.every(result => result === "success")) { console.error(results); process.exit(1); }'
