# Disposable local stand-ins for the incident's platform.
#
#   postgres     The production database server (AWS RDS in the incident;
#                Azure Database for PostgreSQL in the Azure mapping).
#                Terraform creates the course_platform database on it.
#   state-store  A separate store for Terraform remote state (Amazon S3 or an
#                Azure Storage account). Unused until you configure a backend.
#
# Both containers trust local connections and publish no public port, so no
# password is needed or stored. Never reuse this configuration outside the lab.
name: prod-db-incident-sim

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automated backups live on the database server, like RDS snapshots.
      - snapshots:/snapshots
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  state-store:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: terraform
      POSTGRES_DB: terraform_state
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - statedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraform -d terraform_state"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  snapshots:
  statedata:
